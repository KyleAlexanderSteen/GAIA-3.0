[package]
name = "gaia-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GAIA 2.0 client (intent, context, invoke, observe, sign, verify, declare)"
repository = "https://github.com/KyleAlexanderSteen/GAIA-2.0"

[dependencies]
ed25519-dalek = "=1.0.1"
rand = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
