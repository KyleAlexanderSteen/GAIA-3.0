# rust-ai-diagnostics.yml
#
# Posts a structured Rust compiler error report as a PR comment after
# every push, formatted for AI-assisted triage.
#
# Phase 2A (2026-09-25): also writes agent-validation.json and uploads it
# as a GitHub Actions artifact so the human-gated correction loop can fetch
# structured diagnostics without a local run.
# See: scripts/agent-validate.sh, gaia-spec/agent-validation.schema.json
#
# What it does:
#   1. Runs `cargo check --workspace --message-format=json`
#   2. Runs `cargo clippy --workspace --lib --message-format=json -- -D warnings`
#   3. Runs `cargo fmt --all --check`
#   4. Parses outputs into:
#      a) /tmp/diag-report.md          — human-readable sticky PR comment
#      b) /tmp/agent-validation.json   — machine-readable schema-validated artifact
#   5. Validates agent-validation.json against gaia-spec/agent-validation.schema.json
#   6. Uploads agent-validation.json as artifact `agent-validation` (7-day retention)
#   7. Posts/updates the sticky markdown comment on the PR

name: Rust AI Diagnostics

on:
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust-ai-diagnostics.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostics:
    name: rust-ai-diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-diag-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-diag-

      - name: Run cargo check (JSON)
        id: check
        run: |
          cargo check --workspace --message-format=json 2>&1 \
            | tee /tmp/check-raw.json || true

      - name: Run cargo clippy (JSON)
        id: clippy
        run: |
          cargo clippy --workspace --lib --message-format=json -- -D warnings 2>&1 \
            | tee /tmp/clippy-raw.json || true

      - name: Run cargo fmt check
        id: fmt
        run: |
          set +e
          cargo fmt --all --check 2>&1 | tee /tmp/fmt-raw.txt
          fmt_status=${PIPESTATUS[0]}
          printf '%s\n' "${fmt_status}" > /tmp/fmt-exit-code
          exit 0

      - name: Build diagnostics report and agent-validation.json
        id: report
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime

          TRAIT_HINTS = {
              "E0382": "value moved \u2014 consider `.clone()` or deriving `Copy`",
              "E0277": "trait bound not satisfied \u2014 check `#[derive(...)]`",
              "E0507": "cannot move out of shared reference",
              "E0508": "cannot move out of type which does not implement `Copy`",
              "E0509": "cannot move out of borrowed content",
          }

          def parse_file(path):
              errors, warnings = [], []
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              msg = json.loads(line)
                          except Exception:
                              continue
                          if msg.get("reason") != "compiler-message":
                              continue
                          m     = msg.get("message", {})
                          level = m.get("level", "")
                          text  = m.get("message", "")
                          code  = (m.get("code") or {}).get("code", "")
                          spans = m.get("spans", [])
                          loc   = ""
                          if spans:
                              s   = spans[0]
                              loc = f"{s.get('file_name','')}:{s.get('line_start','')}"
                          entry = {"level": level, "code": code, "text": text, "loc": loc}
                          if level == "error":
                              errors.append(entry)
                          elif level == "warning":
                              warnings.append(entry)
              except FileNotFoundError:
                  pass
              return errors, warnings

          check_errors,  check_warnings  = parse_file("/tmp/check-raw.json")
          clippy_errors, clippy_warnings = parse_file("/tmp/clippy-raw.json")

          all_errors   = check_errors   + clippy_errors
          all_warnings = check_warnings + clippy_warnings

          # \u2500\u2500 fmt status \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
          # Use cargo fmt's authoritative exit status; output text alone is
          # not a reliable success/failure signal.
          fmt_ok = False
          fmt_exit_code = None
          try:
              with open("/tmp/fmt-exit-code") as f:
                  fmt_exit_code = int(f.read().strip())
              fmt_ok = fmt_exit_code == 0
          except (FileNotFoundError, ValueError):
              fmt_output = ""
          try:
              with open("/tmp/fmt-raw.txt") as f:
                  fmt_output = f.read().strip()
          except FileNotFoundError:
              fmt_output = ""

          # \u2500\u2500 markdown report (existing behaviour, unchanged) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
          lines = []
          lines.append("## Rust AI Diagnostics Report")
          lines.append("")
          lines.append("> Auto-generated \u2014 paste this comment to your AI assistant for triage.")
          lines.append("")

          if not all_errors and not all_warnings and fmt_ok:
              lines.append("**No errors or warnings detected.** Workspace is clean.")
          else:
              lines.append(f"### Errors ({len(all_errors)})")
              lines.append("")
              if all_errors:
                  lines.append("| Code | Location | Message | Hint |")
                  lines.append("|---|---|---|---|")
                  for e in all_errors:
                      hint      = TRAIT_HINTS.get(e["code"], "")
                      code_cell = f"`{e['code']}`" if e["code"] else "\u2014"
                      loc_cell  = f"`{e['loc']}`"  if e["loc"]  else "\u2014"
                      msg_cell  = e["text"].replace("|", "\\|")[:120]
                      lines.append(f"| {code_cell} | {loc_cell} | {msg_cell} | {hint} |")
              else:
                  lines.append("No compiler errors.")
              lines.append("")
              lines.append(f"### Warnings ({len(all_warnings)})")
              lines.append("")
              if all_warnings:
                  lines.append("<details><summary>Show warnings</summary>")
                  lines.append("")
                  lines.append("| Code | Location | Message |")
                  lines.append("|---|---|---|")
                  for w in all_warnings[:40]:
                      code_cell = f"`{w['code']}`" if w["code"] else "\u2014"
                      loc_cell  = f"`{w['loc']}`"  if w["loc"]  else "\u2014"
                      msg_cell  = w["text"].replace("|", "\\|")[:120]
                      lines.append(f"| {code_cell} | {loc_cell} | {msg_cell} |")
                  if len(all_warnings) > 40:
                      lines.append(f"| \u2026 | | {len(all_warnings)-40} more warnings not shown |")
                  lines.append("")
                  lines.append("</details>")
              else:
                  lines.append("No warnings.")
              if not fmt_ok:
                  lines.append("")
                  lines.append("### Format")
                  lines.append("")
                  lines.append(f"> `cargo fmt --all --check` exited {fmt_exit_code}; formatter output listed {len(fmt_files)} unformatted file(s).")
                  if fmt_changed_files:
                      lines.append("")
                      lines.append(f"**PR-changed files reported by rustfmt ({len(fmt_changed_files)}):**")
                      for path in fmt_changed_files:
                          lines.append(f"- `{path}`")
                  elif fmt_files and changed_files:
                      lines.append("")
                      lines.append("**PR-changed files reported by rustfmt:** 0")
                      lines.append(f"**Unrelated/pre-existing formatter files reported:** {fmt_unrelated_count}")
                      lines.append("")
                      lines.append("> The formatter failure is outside this PR's changed-file set.")

          lines.append("")
          lines.append("---")
          checked_sha = os.popen("git rev-parse HEAD").read().strip() or "unknown"
          pr_head_sha = os.environ.get("PR_HEAD_SHA", "unknown")
          lines.append(f"*Checked commit: `{checked_sha}` · PR head: `{pr_head_sha}` · Workflow: `rust-ai-diagnostics`*")

          report = "\n".join(lines)
          with open("/tmp/diag-report.md", "w", encoding="utf-8") as fh:
              fh.write(report)

          # \u2500\u2500 agent-validation.json \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
          stages = []
          failed_stage = None

          def stage(name, ok):
              global failed_stage
              status = "passed" if ok else "failed"
              if not ok and failed_stage is None:
                  failed_stage = name
              stages.append({"name": name, "status": status, "exit_code": 0 if ok else 1, "duration_s": 0})

          stage("cargo-check",  len(check_errors)  == 0)
          stage("cargo-clippy", len(clippy_errors) == 0)
          stage("cargo-fmt",    fmt_ok)

          overall = "passed" if failed_stage is None else "failed"

          diagnostics = []
          for e in all_errors:
              fp = f"{e['code']}:{e['loc']}"
              diagnostics.append({
                  "level":       e["level"],
                  "code":        e["code"],
                  "path":        e["loc"],
                  "message":     e["text"][:200],
                  "fingerprint": fp
              })

          if not fmt_ok:
              diagnostics.append({
                  "level":       "error",
                  "code":        "fmt",
                  "path":        "",
                  "message":     f"cargo fmt --all --check found {len(fmt_files)} unformatted file(s); {len(fmt_changed_files)} overlap the PR diff",
                  "fingerprint": "fmt:unformatted"
              })

          result = {
              "schema_version": "1.0",
              "head_sha":       checked_sha,
              "timestamp":      datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "mode":           "changed",
              "status":         overall,
              "failed_stage":   failed_stage,
              "attempt":        1,
              "stages":         stages,
              "diagnostics":    diagnostics
          }

          with open("/tmp/agent-validation.json", "w", encoding="utf-8") as fh:
              json.dump(result, fh, indent=2)

          print(f"diag-report.md written ({len(report)} chars)")
          print(f"agent-validation.json written \u2014 status: {overall}, failed_stage: {failed_stage}")
          print(f"  errors: {len(all_errors)}, warnings: {len(all_warnings)}, fmt_ok: {fmt_ok}, fmt_exit_code: {fmt_exit_code}")
          print(f"  checked_sha: {checked_sha}, pr_head_sha: {pr_head_sha}")
          print(f"  formatter_files: {len(fmt_files)}, pr_changed_formatter_files: {len(fmt_changed_files)}, unrelated_formatter_files: {fmt_unrelated_count}")
          PYEOF

      - name: Validate agent-validation.json against schema
        run: |
          python3 -m pip install jsonschema --quiet
          python3 - <<'PYEOF'
          import json, sys, jsonschema

          with open("/tmp/agent-validation.json") as f:
              instance = json.load(f)

          with open("gaia-spec/agent-validation.schema.json") as f:
              schema = json.load(f)

          try:
              jsonschema.validate(instance=instance, schema=schema)
              print("agent-validation.json is valid against schema.")
          except jsonschema.ValidationError as e:
              print(f"SCHEMA VALIDATION FAILED: {e.message}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Upload agent-validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-validation
          path: /tmp/agent-validation.json
          retention-days: 7

      - name: Enforce diagnostics result
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, sys

          with open("/tmp/agent-validation.json") as f:
              result = json.load(f)

          status = result.get("status")
          failed_stage = result.get("failed_stage")
          head_sha = result.get("head_sha")

          print(f"agent-validation status: {status}")
          print(f"failed_stage: {failed_stage}")
          print(f"head_sha: {head_sha}")

          if status != "passed":
              print(
                  f"Rust AI Diagnostics failed at {failed_stage or 'unknown stage'}; "
                  "failing the workflow so CI status matches the validation result.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PYEOF

      - name: Post diagnostics comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rust-ai-diagnostics -->';
            const report = fs.readFileSync('/tmp/diag-report.md', 'utf8');
            const body = marker + '\n' + report;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Updated existing diagnostics comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new diagnostics comment.');
            }
