name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AIP examples and schemas
        run: |
          python -m pip install jsonschema
          python gaia-spec/tools/validate_aip.py
          python gaia-spec/tools/validate_identity.py
          python gaia-spec/tools/check_claim_tags.py

  claim-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Claim-validation gate (#370)
        run: python gaia-spec/tools/check_claim_tags.py

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust SDK
        run: cargo test --manifest-path gaia-sdk/rust/Cargo.toml

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python SDK
        run: |
          python -m pip install -e "gaia-sdk/python[dev]"
          pytest -q gaia-sdk/python

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gaia-sdk/typescript/package.json

      - name: Test TypeScript SDK
        working-directory: gaia-sdk/typescript
        run: |
          npm install
          npm test

  gaia-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gaia-ui/package.json

      - name: Install gaia-ui dependencies
        working-directory: gaia-ui
        run: npm install

      - name: Build gaia-ui
        working-directory: gaia-ui
        run: npm run build

      - name: Test gaia-ui
        working-directory: gaia-ui
        run: npm test

  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Generate Cargo.lock if absent
        run: cargo generate-lockfile
      - name: Test Rust workspace (library crates only)
        run: cargo test --workspace --exclude gaia-cli
      - name: Regression locks (#936)
        run: cargo test -p gaia-integrity --test regression --test contracts

  rust-cli-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-
      - name: Generate Cargo.lock if absent
        run: cargo generate-lockfile
      - name: Build gaia binary (required by assert_cmd integration tests)
        run: cargo build -p gaia-cli
      - name: Run gaia-cli integration tests
        run: cargo test -p gaia-cli

  # #1294: lint test code too. --all-targets includes #[cfg(test)] modules,
  # integration tests, examples, and benches, which plain `cargo clippy` skips.
  # No -D warnings yet: this job fails only on error-level lints, so it cannot
  # turn CI red over existing style warnings. Tightening is a separate step.
  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Generate Cargo.lock if absent
        run: cargo generate-lockfile
      - name: Clippy (all targets, whole workspace)
        run: cargo clippy --workspace --all-targets

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown presence check
        run: |
          test -f README.md
          test -f gaia-spec/README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
