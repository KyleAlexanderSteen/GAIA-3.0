name: PR lifecycle governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  lifecycle:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq '[.[] | {number: .number, title: .title, body: (.body // "")}]' > active-prs.json
      - name: Validate PR issue lifecycle
        run: |
          printf '%s' "$PR_BODY" > pr-body.md
          python tools/agent-skills/pr_lifecycle_check.py --body pr-body.md --active-prs active-prs.json --current-pr "${{ github.event.pull_request.number }}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: Validate definition of done
        run: printf '%s' "$PR_BODY" | python tools/agent-skills/dod_check.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

  post-merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect linked issue states
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.md
          python - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "tools/agent-skills")
          from pr_lifecycle_postmerge_check import relationships

          body = os.environ.get("PR_BODY", "")
          refs = sorted({n for _, numbers in relationships(body) for n in numbers})
          states = {}
          for number in refs:
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{number}"],
                  text=True,
              )
              states[str(number)] = json.loads(raw)["state"]
          json.dump(states, open("issue-states.json", "w", encoding="utf-8"), sort_keys=True)
          print(json.dumps(states, sort_keys=True))
          PY
      - name: Verify post-merge issue state
        run: python tools/agent-skills/pr_lifecycle_postmerge_check.py --body pr-body.md --states issue-states.json

  self-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lifecycle unit tests
        run: |
          python -m unittest tools/agent-skills/test_pr_lifecycle_check.py
          python -m unittest tools/agent-skills/test_pr_lifecycle_postmerge_check.py
      - name: Run end-to-end relationship simulation
        run: |
          cat > pr-body.md <<'EOF'
          Closes #1624

          ## Stage reached
          - [x] SPECIFICATION
          - [x] IMPLEMENTATION
          - [x] TEST
          - [x] INTEGRATION
          - [x] VERIFICATION
          - [x] OPERATIONAL
          EOF
          printf '%s' '{"1624":"closed"}' > issue-states.json
          python tools/agent-skills/pr_lifecycle_check.py --body pr-body.md
          python tools/agent-skills/pr_lifecycle_postmerge_check.py --body pr-body.md --states issue-states.json
          echo "GAIA PR lifecycle self-test: PASS"
