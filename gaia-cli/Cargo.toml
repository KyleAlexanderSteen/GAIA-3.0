[package]
name = "gaia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GAIA developer CLI — command-line interface for the GAIA runtime"

[[bin]]
name = "gaia-cli"
path = "src/main.rs"

[lib]
name = "gaia_cli"
path = "src/lib.rs"

[dependencies]
ureq = "2"
sha2 = "0.10"
gaia-kernel = { path = "../gaia-kernel" }
gaia-dispatch = { path = "../gaia-dispatch" }
gaia-skills = { path = "../gaia-skills" }
gaia-runtime = { path = "../gaia-runtime" }
gaia-acp = { path = "../gaia-acp" }
gaia-inference = { path = "../gaia-inference" }
clap       = { version = "4", features = ["derive"] }
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
gaia-gateway = { path = "../gaia-gateway" }
axum = { version = "0.8", features = ["macros"] }
