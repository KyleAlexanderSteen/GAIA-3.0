$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://gaia-os.org/schema/verification/promotion-record.schema.yaml"
title: "GAIA Verification Promotion Record"
description: "Machine-readable evidence record for a GAIA verification-stage transition."
type: object
additionalProperties: false
required: [schema_version, record_id, artifact, decision, evidence, scope, environment, assumptions, limitations, known_unknowns]
properties:
  schema_version: {type: string, const: "1.0"}
  record_id: {type: string, minLength: 1}
  artifact:
    type: object
    additionalProperties: false
    required: [repository, commit_sha]
    properties:
      repository: {type: string, minLength: 1}
      commit_sha: {type: string, pattern: "^[0-9a-fA-F]{40}$"}
      artifact_digest: {type: string}
      build_id: {type: string}
  decision:
    type: object
    additionalProperties: false
    required: [from_stage, to_stage, outcome]
    properties:
      from_stage: {type: string}
      to_stage: {type: string}
      outcome: {enum: [PASS, HOLD, FAIL, UNKNOWN]}
      decided_at: {type: string, format: date-time}
      authority: {type: string}
      rationale: {type: string}
  evidence:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, kind, reference]
      properties:
        id: {type: string}
        kind: {type: string}
        reference: {type: string}
        result: {enum: [PASS, FAIL, INCONCLUSIVE, NOT_RUN]}
        collected_at: {type: string, format: date-time}
        collector: {type: string}
  scope:
    type: object
    additionalProperties: false
    required: [statement]
    properties:
      statement: {type: string}
      included: {type: array, items: {type: string}}
      excluded: {type: array, items: {type: string}}
  environment:
    type: object
    additionalProperties: false
    required: [summary]
    properties:
      summary: {type: string}
      platform: {type: string}
      toolchain: {type: string}
      ci_run: {type: string}
  assumptions: {type: array, items: {type: string}}
  limitations: {type: array, items: {type: string}}
  known_unknowns: {type: array, items: {type: string}}
  authorization:
    type: object
    additionalProperties: false
    properties:
      required: {type: boolean}
      actor: {type: string}
      granted_at: {type: string, format: date-time}
  rollback:
    type: object
    additionalProperties: false
    properties:
      available: {type: boolean}
      reference: {type: string}
      trigger: {type: string}