[package]
name        = "gaia-runtime"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
description = "WASM/WASI 0.3 sandbox execution engine for GAIA agents"

[dependencies]
# "std" enables the std::error::Error impl on wasmtime::Error, which is
# required for the &dyn std::error::Error coercion in classify_trap.
wasmtime      = { version = "46", features = ["component-model", "async", "std"] }
wasmtime-wasi = { version = "46", features = ["p3"] }
cap-std       = "3"
serde         = { version = "1", features = ["derive"] }
thiserror     = "1"
anyhow        = "1"
tokio         = { version = "1", features = ["rt", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
wat = "1"

[features]
default  = ["tokio-rt"]
tokio-rt = ["dep:tokio"]
